plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jsaq.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jsaq.app"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "2.1"
    }

    signingConfigs {
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
